[project]
name = "short-video-editor"
version = "0.1.0"
description = "Лабораторная работа № 2: объектная модель видеоредактора"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7"]

[project.scripts]
video-editor = "video_editor.application:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_editor"]

